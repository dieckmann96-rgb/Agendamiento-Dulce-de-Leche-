<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dulce de Leche — Panel</title><style>
:root{--brown:#4b2718;--gold:#c07a2b;--cream:#fbf5e9;--line:#e5c18f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:Arial,sans-serif}header{max-width:1180px;margin:auto;padding:22px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:64px;height:64px;object-fit:contain;border-radius:50%}.brand h1{font-family:Georgia,serif;margin:0;font-size:30px}.brand p{margin:3px 0 0}.btn{border:1px solid var(--line);background:#fffaf1;color:var(--brown);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}.btn.primary{background:var(--brown);color:white}.nav{max-width:1180px;margin:8px auto 14px;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}.nav button{flex:0 0 auto}.nav button.active{background:var(--brown);color:white}.frame-wrap{max-width:1180px;margin:auto;padding:0 20px 30px}.module-frame{width:100%;border:0;display:block;background:transparent;min-height:700px}#login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 12px 30px #4b27181a}.login-card h2{font-family:Georgia,serif;margin-top:0}.login-card input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;margin:8px 0 14px}.error{color:#a33;margin-top:10px}@media(max-width:600px){header{padding:14px 10px 8px}.brand img{width:48px;height:48px}.brand h1{font-size:21px}.brand p{font-size:12px}.nav{padding:0 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.nav button{width:100%;padding:9px 8px}.nav button:last-child{grid-column:1/-1}.frame-wrap{padding:0 6px 20px}.module-frame{min-height:900px}}
</style></head><body>
<div id="login"><div class="login-card"><div class="brand"><img src="logo.jpg"><div><h1>Dulce de Leche</h1><p>Panel administrativo</p></div></div><h2>Entrar al panel</h2><input id="token" type="password" autocomplete="current-password" placeholder="Código de acceso"><button class="btn primary" id="loginBtn">Entrar</button><div id="msg"></div></div></div>
<div id="panel" hidden><header><div class="brand"><img src="logo.jpg"><div><h1>Dulce de Leche</h1><p>Panel administrativo</p></div></div><button class="btn" id="logout">Cerrar sesión</button></header><nav class="nav"><button class="btn active" data-mod="agenda">📅 Agenda</button><button class="btn" data-mod="finance">💰 Finanzas</button><button class="btn" data-mod="reports">📊 Informes</button><button class="btn" data-mod="clients">👤 Clientes</button><button class="btn" data-mod="postventa">💬 Pós-venta</button></nav><main class="frame-wrap"><iframe id="frame" class="module-frame" title="Módulo del panel"></iframe></main></div>
<script>
const KEY='dl_admin_token'; const login=document.getElementById('login'),panel=document.getElementById('panel'),frame=document.getElementById('frame');
function getToken(){try{return localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||''}catch(e){return ''}}
function saveToken(t){try{localStorage.setItem(KEY,t);sessionStorage.setItem(KEY,t)}catch(e){};document.cookie='dl_admin_token='+encodeURIComponent(t)+'; Path=/; Max-Age=86400; SameSite=Lax; Secure'}
function clearToken(){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(e){};document.cookie='dl_admin_token=; Path=/; Max-Age=0; SameSite=Lax; Secure'}
function openModule(mod){const map={agenda:'agenda.html',finance:'finance.html',reports:'reports.html',clients:'clients.html',postventa:'postventa.html'};if(!map[mod])return;document.querySelectorAll('[data-mod]').forEach(b=>b.classList.toggle('active',b.dataset.mod===mod));frame.src=map[mod]+'?embedded=1&v=90';}
window.openModule=openModule;
function showPanel(){login.hidden=true;panel.hidden=false;openModule('agenda')}
function doLogin(){const t=document.getElementById('token').value.trim();if(!t){document.getElementById('msg').innerHTML='<div class="error">Introduce el código de acceso.</div>';return}saveToken(t);showPanel();}
document.getElementById('loginBtn').onclick=doLogin;document.getElementById('token').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>openModule(b.dataset.mod));document.getElementById('logout').onclick=()=>{clearToken();frame.src='about:blank';panel.hidden=true;login.hidden=false;document.getElementById('token').value=''};
frame.addEventListener('load',()=>{try{frame.contentWindow.postMessage({type:'dl-auth',token:getToken()},location.origin)}catch(e){}});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='dl-module-height')frame.style.height=Math.max(700,Number(e.data.height||900))+'px';if(e.data?.type==='dl-logout'){clearToken();document.getElementById('logout').click()}});
if(getToken())showPanel();
</script></body></html>
